<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stronger Parallax 3D Effect</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-2, 2, 1.5, -1.5, 0.1, 10);
  camera.position.z = 1;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const loader = new THREE.TextureLoader();
  const colorTexture = loader.load("./public/Test.jpg", () => console.log("✅ Color loaded"));
  const depthTexture = loader.load("./public/Test_depth.png", () => console.log("✅ Depth loaded"));

  // Shader material for stronger parallax effect
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: colorTexture },
      uDepth: { value: depthTexture },
      uMouse: { value: new THREE.Vector2(0.5, 0.5) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uColor;
      uniform sampler2D uDepth;
      uniform vec2 uMouse;
      varying vec2 vUv;
      void main() {
        float depth = texture2D(uDepth, vUv).r;
        vec2 offset = (uMouse - 0.5) * 0.25 * depth; // stronger offset
        vec2 uv = clamp(vUv + offset, 0.0, 1.0);     // clamp to avoid distortion
        gl_FragColor = texture2D(uColor, uv);
      }
    `
  });

  const geometry = new THREE.PlaneGeometry(4, 3); // larger plane
  const plane = new THREE.Mesh(geometry, material);
  scene.add(plane);

  // Mouse move updates
  window.addEventListener("mousemove", (event) => {
    material.uniforms.uMouse.value.x = event.clientX / window.innerWidth;
    material.uniforms.uMouse.value.y = 1.0 - event.clientY / window.innerHeight;
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
