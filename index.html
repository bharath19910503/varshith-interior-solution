<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Depth Map 3D Effect</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // Scene + Camera
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Load textures (served from /public on GitHub Pages)
  const loader = new THREE.TextureLoader();
  const colorTexture = loader.load("./public/Test.jpg", () => console.log("Color loaded"));
  const depthTexture = loader.load("./public/Test_depth.png", () => console.log("Depth loaded"));

  // Plane with displacement
  const geometry = new THREE.PlaneGeometry(4, 3, 256, 256);
  const material = new THREE.MeshStandardMaterial({
    map: colorTexture,
    displacementMap: depthTexture,
    displacementScale: 0.5,
  });

  const plane = new THREE.Mesh(geometry, material);
  scene.add(plane);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(2, 2, 2);
  scene.add(light);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
