<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: gold;
      text-align: center;
    }
    header {
      background-color: #000;
      padding: 20px;
    }
    header img {
      height: 80px;
    }
    h1 {
      margin: 10px 0;
      font-size: 28px;
      color: gold;
    }
    select, button {
      margin: 10px;
      padding: 8px;
      font-size: 16px;
      background: #222;
      color: gold;
      border: 1px solid gold;
      border-radius: 4px;
    }
    #preview {
      margin-top: 20px;
    }
    #preview img {
      max-width: 80%;
      border: 4px solid gold;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Varshith Interior Solutions Logo">
    <h1>VARSHITH INTERIOR SOLUTIONS</h1>
    <p>Shape Your Future Space</p>
  </header>

  <form onsubmit="showDesign(); return false;">
    <label for="room">Select Room:</label>
    <select id="room">
      <option value="kitchen">Kitchen</option>
      <option value="tv">TV Unit</option>
      <option value="bedroom">Bedroom</option>
    </select><br>
    <button type="submit">Show Design</button>
  </form>

  <div id="preview"></div>
  <button onclick="prevImage()">Previous</button>
  <button onclick="nextImage()">Next</button>

  <script src="script.js"></script>
</body>
</html>
